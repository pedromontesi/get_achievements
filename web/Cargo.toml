[package]
name = "get_achievements_web"
version = "0.1.0"
edition = "2021"

[dependencies]
console_error_panic_hook = "0.1"
gloo-net = { version = "0.7", default-features = false, features = ["http", "json"] }
leptos = { version = "0.8", features = ["csr"] }
serde = { version = "1", features = ["derive"] }

# Deixa o .wasm menor no `trunk build --release`.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

[dev-dependencies]
serde_json = "1"
